version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: remitsave-postgres
    environment:
      POSTGRES_DB: remitsave
      POSTGRES_USER: remitsave
      POSTGRES_PASSWORD: remitsave_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitsave -d remitsave"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: remitsave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  stellar:
    image: stellar/quickstart:soroban-dev@sha256:0f3b8d4e2bf6f1d2c97c6dd9ab3a3c5fb9824b88b0c9e7247e58e123651d8c68
    container_name: remitsave-stellar
    command: ["--standalone", "--enable-soroban-rpc"]
    ports:
      - "8000:8000"
      - "11626:11626"
    volumes:
      - stellar_data:/opt/stellar

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: remitsave-auth-service
    environment:
      DATABASE_URL: postgres://remitsave:remitsave_dev@postgres:5432/remitsave
      JWT_SECRET: remitsave-dev-secret-do-not-use-in-prod
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  remit-service:
    build:
      context: ./backend
      dockerfile: remit-service/Dockerfile
    container_name: remitsave-remit-service
    environment:
      DATABASE_URL: postgres://remitsave:remitsave_dev@postgres:5432/remitsave
      JWT_SECRET: remitsave-dev-secret-do-not-use-in-prod
      SOROBAN_RPC_URL: http://stellar:8000/soroban/rpc
      REMIT_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  event-watcher:
    build:
      context: ./backend
      dockerfile: event-watcher/Dockerfile
    container_name: remitsave-event-watcher
    environment:
      DATABASE_URL: postgres://remitsave:remitsave_dev@postgres:5432/remitsave
      SOROBAN_RPC_URL: http://stellar:8000/soroban/rpc
      REMIT_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      POLL_INTERVAL_SECS: 5
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: remitsave-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - remit-service

volumes:
  postgres_data:
  redis_data:
  stellar_data:
